<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu painel — RicServ</title>
<link rel="stylesheet" href="ricserv-styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Google AdSense: depois de ter sua conta aprovada, remova os comentarios e coloque seu ID de editor -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FF4405">
</head>
<body>
<div class="wrap">

  <div class="top">
    <a href="/index.html" class="brand">Ric<span>Serv</span></a>
    <button class="btn btn-ghost" id="btnSair">Sair</button>
  </div>

  <section style="padding-top:0;">
    <div id="saudacao" style="margin-bottom:16px;">
      <h1 style="font-size:20px;">Carregando...</h1>
    </div>

    <div id="msgBox"></div>

    <!-- ===== Visão do CLIENTE ===== -->
    <div id="painelCliente" style="display:none;">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px;">Novo pedido de serviço</div>
        <form id="formPedido">
          <div class="field">
            <label for="titulo">O que você precisa? (título curto)</label>
            <input type="text" id="titulo" placeholder="Ex: Instalar chuveiro elétrico" required>
          </div>
          <div class="field">
            <label for="descricao">Detalhes</label>
            <textarea id="descricao" placeholder="Descreva o serviço, urgência, etc." required></textarea>
          </div>
          <div class="field">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Publicar pedido</button>
        </form>
      </div>

      <h2 style="font-size:16px; margin: 24px 0 12px;">Meus pedidos</h2>
      <div id="listaMeusPedidos"></div>
    </div>

    <!-- ===== Visão do PROFISSIONAL ===== -->
    <div id="painelProfissional" style="display:none;">
      <h2 style="font-size:16px; margin:0 0 12px;">Pedidos em aberto</h2>
      <p style="font-size:12px; color:var(--muted); margin:-6px 0 14px;"><strong>Liberar o contato do cliente custa R$ 9,90</strong> — pague só pelos contatos que você quiser, sem pacotes.</p>
      <div id="listaPedidosAbertos"></div>
    </div>
  </section>


  <footer>
    Grupo Riccieri - 2026
  </footer>

</div>

<script src="config.js"></script>
<script>
  let perfilAtual = null;

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return;
    }

    const { data: perfil, error } = await sb
      .from('profiles')
      .select('*')
      .eq('id', session.user.id)
      .single();

    if (error || !perfil) {
      mostraMsg('Não foi possível carregar seu perfil. Tente sair e entrar novamente.', 'error');
      return;
    }

    perfilAtual = perfil;
    document.getElementById('saudacao').innerHTML = `<h1 style="font-size:20px;">Olá, ${perfil.nome.split(' ')[0]}</h1>`;

    if (perfil.role === 'cliente') {
      document.getElementById('painelCliente').style.display = 'block';
      preencherPedidoDaBusca();
      carregarMeusPedidos();
    } else {
      document.getElementById('painelProfissional').style.display = 'block';
      carregarPedidosAbertos();

      // Se voltou de um checkout de liberação de contato, confirma e revela.
      const params = new URLSearchParams(window.location.search);
      if (params.get('checkout') === 'retorno' && params.get('request_id')) {
        mostraMsg('Confirmando seu pagamento...', 'ok');
        iniciarPolling(params.get('request_id'));
        window.history.replaceState({}, '', '/painel.html');
      }
    }
  }

  function mostraMsg(texto, tipo) {
    document.getElementById('msgBox').innerHTML = `<div class="msg ${tipo}">${texto}</div>`;
  }

  // Se veio da busca da home ("Pedir"), já preenche o formulário
  function preencherPedidoDaBusca() {
    const params = new URLSearchParams(window.location.search);
    const texto = params.get('novoPedido');
    if (texto) {
      document.getElementById('descricao').value = texto;
      document.getElementById('titulo').value = texto.slice(0, 60);
      document.getElementById('cidade').value = perfilAtual.cidade || '';
    }
  }

  document.getElementById('formPedido').addEventListener('submit', async (e) => {
    e.preventDefault();
    const titulo = document.getElementById('titulo').value.trim();
    const descricao = document.getElementById('descricao').value.trim();
    const cidade = document.getElementById('cidade').value.trim();

    const { error } = await sb.from('service_requests').insert({
      client_id: perfilAtual.id,
      titulo, descricao, cidade
    });

    if (error) {
      mostraMsg('Não foi possível publicar o pedido. Tente novamente.', 'error');
      return;
    }

    document.getElementById('formPedido').reset();
    mostraMsg('Pedido publicado! Profissionais da sua região já podem ver.', 'ok');
    carregarMeusPedidos();
  });

  async function carregarMeusPedidos() {
    const { data, error } = await sb
      .from('service_requests')
      .select('*')
      .eq('client_id', perfilAtual.id)
      .order('created_at', { ascending: false });

    const container = document.getElementById('listaMeusPedidos');
    if (error) { container.innerHTML = '<div class="empty-state">Erro ao carregar pedidos.</div>'; return; }
    if (!data.length) { container.innerHTML = '<div class="empty-state">Você ainda não publicou nenhum pedido.</div>'; return; }

    container.innerHTML = data.map(p => `
      <div class="card">
        <span class="badge ${p.status !== 'aberto' ? 'warn' : ''}">${p.status}</span>
        <div class="card-title" style="margin-top:8px;">${escapeHtml(p.titulo)}</div>
        <div class="card-meta">${escapeHtml(p.cidade || '')} · ${formataData(p.created_at)}</div>
        <div class="card-desc">${escapeHtml(p.descricao)}</div>
      </div>
    `).join('');
  }

  async function carregarPedidosAbertos() {
    const { data, error } = await sb
      .from('service_requests')
      .select('*')
      .eq('status', 'aberto')
      .order('created_at', { ascending: false });

    const container = document.getElementById('listaPedidosAbertos');
    if (error) { container.innerHTML = '<div class="empty-state">Erro ao carregar pedidos.</div>'; return; }
    if (!data.length) { container.innerHTML = '<div class="empty-state">Nenhum pedido em aberto no momento. Volte mais tarde!</div>'; return; }

    // Nome do cliente aparece de graça; telefone só depois de liberar.
    const idsPedidos = data.map(p => p.id);
    const { data: nomes } = await sb.rpc('nomes_clientes_pedidos', { p_request_ids: idsPedidos });
    const nomeMap = {};
    (nomes || []).forEach(n => { nomeMap[n.request_id] = n.nome; });

    // Descobre quais pedidos esse profissional já pagou antes.
    const { data: liberados } = await sb
      .from('contatos_liberados')
      .select('request_id')
      .eq('profissional_id', perfilAtual.id);
    const idsLiberados = new Set((liberados || []).map(l => l.request_id));

    container.innerHTML = data.map(p => renderCardPedido(p, idsLiberados.has(p.id), nomeMap[p.id])).join('');

    // Para os já liberados, busca o contato pra exibir direto (sem cobrar de novo).
    idsLiberados.forEach(async (id) => {
      if (data.some(p => p.id === id)) await revelarContatoJaLiberado(id);
    });

    document.querySelectorAll('.btn-liberar').forEach(btn => {
      btn.addEventListener('click', () => iniciarCheckoutLiberacao(btn.dataset.id));
    });
  }

  function renderCardPedido(p, jaLiberado, nomeCliente) {
    const primeiroNome = (nomeCliente || 'Cliente').trim().split(' ')[0];
    return `
      <div class="card" id="card-${p.id}">
        <div class="card-title">${escapeHtml(p.titulo)}</div>
        <div class="card-meta">${escapeHtml(p.cidade || '')} · ${formataData(p.created_at)}</div>
        <div class="card-desc">${escapeHtml(p.descricao)}</div>
        <div style="font-size:13px; color:var(--muted); margin:8px 0;">Cliente: <strong>${escapeHtml(primeiroNome)}</strong> · telefone oculto</div>
        <div id="contato-${p.id}">
          ${jaLiberado
            ? '<div style="font-size:13px; color:var(--muted);">Carregando contato...</div>'
            : `<button class="btn btn-primary btn-liberar" data-id="${p.id}"><strong>Liberar contato (R$ 9,90)</strong></button>`
          }
        </div>
      </div>
    `;
  }

  async function revelarContatoJaLiberado(requestId) {
    const alvo = document.getElementById(`contato-${requestId}`);
    const { data, error } = await sb.rpc('obter_contato_liberado', { p_request_id: requestId });
    if (error || !data || !data[0]) {
      if (alvo) alvo.innerHTML = '<div style="font-size:13px; color:var(--muted);">Não foi possível carregar o contato.</div>';
      return;
    }
    const contato = data[0];
    if (alvo) {
      alvo.innerHTML = `<div style="font-size:13px; color:var(--confirm); font-weight:600;">Contato: ${escapeHtml(contato.nome)} — ${escapeHtml(contato.telefone || 'não informado')}</div>`;
    }
  }

  async function iniciarCheckoutLiberacao(requestId) {
    const alvo = document.getElementById(`contato-${requestId}`);
    if (alvo) alvo.innerHTML = '<div style="font-size:13px; color:var(--muted);">Preparando pagamento...</div>';

    try {
      const { data: { session } } = await sb.auth.getSession();
      const resp = await fetch('/api/criar-checkout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ requestId }),
      });
      const dados = await resp.json();

      if (!resp.ok) {
        const detalhesTexto = dados.detalhes ? ` — ${JSON.stringify(dados.detalhes)}` : '';
        if (alvo) alvo.innerHTML = `<div class="msg error" style="margin:0;">${(dados.erro || 'Não foi possível gerar a cobrança.') + detalhesTexto}</div>`;
        return;
      }

      if (dados.jaLiberado) {
        // Já tinha pago antes (ex: dois cliques rápidos) — só revela.
        await revelarContatoJaLiberado(requestId);
        return;
      }

      window.open(dados.checkoutUrl, '_blank');
      if (alvo) alvo.innerHTML = `
        <div style="font-size:13px; color:var(--muted); margin-bottom:6px;">Pagamento aberto em outra aba. Volte aqui depois de pagar.</div>
        <button class="btn btn-block btn-reabrir" data-url="${dados.checkoutUrl}" style="margin-bottom:6px;">Reabrir a página de pagamento</button>
      `;
      const btnReabrir = alvo.querySelector('.btn-reabrir');
      if (btnReabrir) {
        btnReabrir.addEventListener('click', () => window.open(btnReabrir.dataset.url, '_blank'));
      }
      iniciarPolling(requestId);
    } catch (e) {
      if (alvo) alvo.innerHTML = `<div class="msg error" style="margin:0;">${e.message || 'Erro de conexão. Tente novamente.'}</div>`;
    }
  }

  const pollingsAtivos = {};

  function iniciarPolling(requestId) {
    if (pollingsAtivos[requestId]) return; // já tem um rodando pra esse pedido
    pollingsAtivos[requestId] = setInterval(async () => {
      const { data } = await sb
        .from('contatos_liberados')
        .select('request_id')
        .eq('profissional_id', perfilAtual.id)
        .eq('request_id', requestId)
        .maybeSingle();

      if (data) {
        clearInterval(pollingsAtivos[requestId]);
        delete pollingsAtivos[requestId];
        await revelarContatoJaLiberado(requestId);
      }
    }, 4000);
  }

  function formataData(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  document.getElementById('btnSair').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = '/index.html';
  });

  init();
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js");
  }
</script>
</body>
</html>
